<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirish | DevBlog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <a class="logo" href="#">DevBlog</a>
            <h1>Hisobingizni kiriting</h1>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="username">Foydalanuvchi nomi</label>
                    <input type="text" id="username" name="username" placeholder="masalan: Doston" required>
                </div>

                <div class="form-group">
                    <label for="password">Parol</label>
                    <input type="password" id="password" name="password" placeholder="Parolingiz" required>
                </div>

                <button type="submit" class="btn">Kirish</button>
            </form>

            <p class="switch">Hisobingiz yo'qmi? <a href="register.html">Ro'yxatdan o'ting</a></p>
        </div>
    </div>
</body>
</html>
