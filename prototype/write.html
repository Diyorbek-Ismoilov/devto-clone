<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post yozish | DevBlog</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="write.css">
</head>
<body>
    <header class="site-header">
        <a class="logo" href="home.html">DevBlog</a>
        <nav>
            <ul>
                <li><a href="login.html">Kirish</a></li>
                <li><a href="register.html">Ro'yhatdan o'tish</a></li>
                <li><a href="write.html">Post yozish</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Yangi post yozish</h1>

        <form class="write-form" action="#" method="post">
            <div class="form-group">
                <label for="title">Sarlavha</label>
                <input type="text" id="title" name="title" maxlength="200" placeholder="Post sarlavhasi" required>
                <small>Taglarni vergul bilan ajrating!</small>
            </div>

            <div class="form-group">
                <label for="tags">Taglar</label>
                <input type="text" id="tags" name="tags" placeholder="python, django, venv">
                <label for="body">Matn</label>
                <textarea id="body" name="body" rows="14" placeholder="Postingizni shu yerga yozing!..." required></textarea>
            </div>

            <div class="form-check">
                <input type="checkbox" id="is_published" name="is_published" checked>
                <label for="is_published">Hozir e'lon qilish</label>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn-publish">Yuborish</button>
                <a href="home.html" class="btn-cancel">Bekor qilish</a>
            </div>
        </form>
    </main>
</body>
</html>
